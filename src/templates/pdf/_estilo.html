<style>
@page { size: A4; }
:root { --cor: {{ marca.color }}; --tinta:#14181F; --cinza:#5B6573; --linha:#D9DEE5; --fundo:#F4F6F9; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--tinta); font-size: 9pt; line-height: 1.4; }
h2 { font-size: 15pt; font-weight: 700; margin-bottom: 1mm; }
h3 { font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; color: var(--cor); margin: 6mm 0 2.5mm; break-after: avoid; }
.lede { color: var(--cinza); font-size: 9.5pt; max-width: 165mm; }
.quebra { break-before: page; }
.bloco { break-inside: avoid; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm; }
.grid div { background: var(--fundo); border-left: 0.8mm solid var(--cor); padding: 2.6mm 3.2mm; break-inside: avoid; }
.grid b { display: block; font-size: 9pt; margin-bottom: .6mm; }
.grid p { color: var(--cinza); font-size: 8pt; }
table { width: 100%; border-collapse: collapse; }
.lim td { padding: 1.8mm 2.5mm; border-bottom: 0.2mm solid var(--linha); vertical-align: top; }
.lim td:first-child { color: var(--cinza); width: 48%; }
.lim td:last-child { font-weight: 600; }
.lim caption, .tab caption { text-align: left; font-size: 7.5pt; color: var(--cinza); padding-bottom: 1.5mm; }
.duas { display: grid; grid-template-columns: 1.55fr 1fr; gap: 6mm; }
.chk { list-style: none; }
.chk li { padding: 1.6mm 0 1.6mm 5mm; border-bottom: 0.2mm solid var(--linha); position: relative; }
.chk li:before { content: ""; position: absolute; left: 0; top: 2.6mm; width: 2mm; height: 2mm; border: 0.3mm solid var(--cor); }
.cert { display: flex; gap: 2.5mm; }
.cert div { flex: 1; background: var(--fundo); padding: 2.5mm; font-size: 7.4pt; color: var(--cinza); }
.cert b { display: block; font-size: 12pt; color: var(--cor); margin-bottom: 1mm; }
.pend { border: 0.3mm dashed var(--linha); padding: 3mm; color: var(--cinza); font-size: 8pt; }
.pend b { color: var(--tinta); display: block; margin-bottom: .8mm; }
.tab { margin-bottom: 4mm; }
.tab th, .idx th { text-align: left; font-size: 7pt; letter-spacing: .1em; text-transform: uppercase; color: var(--cinza); padding: 2mm 2.5mm; border-bottom: 0.5mm solid var(--tinta); }
.tab td { padding: 1.5mm 2.5mm; border-bottom: 0.2mm solid var(--linha); font-size: 8pt; }
.idx td { padding: 1.9mm 2.5mm; border-bottom: 0.2mm solid var(--linha); }
.idx tr { break-inside: avoid; }
.idx td.c { font-weight: 700; width: 26mm; }
.idx td.r, .idx th.r { text-align: right; }
.ficha { height: 120mm; overflow: hidden; border: 0.25mm solid var(--linha); display: grid; grid-template-columns: 100mm 1fr; margin-bottom: 7mm; break-inside: avoid; }
.ficha .des { border-right: 0.25mm solid var(--linha); display: flex; align-items: center; justify-content: center; padding: 6mm; position: relative; }
.ficha .des img { max-width: 100%; max-height: 102mm; }
.ficha .des .esc { position: absolute; bottom: 2.5mm; left: 3mm; font-size: 6.5pt; color: var(--cinza); }
.ficha .des .sem { color: var(--cinza); font-size: 8pt; }
.ficha .dad { padding: 4mm 5mm 3mm; display: flex; flex-direction: column; min-height: 0; }
.ficha .cod { font-size: 22pt; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
.ficha .cod:after { content: ""; display: block; width: 12mm; height: 0.8mm; background: var(--cor); margin: 2mm 0 1.5mm; }
.ficha .nome { font-size: 10.5pt; font-weight: 600; margin-bottom: 1.5mm; }
.prop td { padding: 0.9mm 0; border-bottom: 0.2mm solid var(--linha); font-size: 8pt; }
.prop td:first-child { color: var(--cinza); }
.prop td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.prop tr.g td { padding-top: 1.8mm; font-size: 6.6pt; letter-spacing: .12em; text-transform: uppercase; color: var(--cor); font-weight: 700; border-bottom: none; text-align: left; }
.ficha .iso { margin-top: auto; flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
.ficha .iso img { max-width: 100%; max-height: 26mm; object-fit: contain; }
.ficha .uso { font-size: 7pt; color: var(--cinza); margin-top: 2mm; }
.ficha .uso b { color: var(--tinta); }
</style>
