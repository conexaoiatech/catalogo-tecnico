solucao:
  slug: solucao
  publicada: true
  logo: "assets/img/marcas/solucao_pt.png"      # fundo escuro (uso na tela)
  logo_claro: "assets/img/marcas/solucao.png"   # fundo branco (impressao)
  logo_alt: "Solução Fechamento Inteligente"
  label: "Solução"
  brand_mark: "SOLUÇÃO"
  brand_sub: "Fechamento Inteligente"
  color: "#0099FF"        # azul amostrado de solucao_pt.png (pixel dominante do logo)
  color_ink: "#66C2FF"
  tint: "#0A1B2E"
  acao: "#3D5AFE"         # botao primario (SITESOLU)
  destaque: "#00E5FF"     # links, numeros e realces (SITESOLU)
  logo_fundo_preto: true  # o build transforma o preto do logo em transparencia na copia de docs/
  entrada_texto: "Sistemas Solução: Sacadas, MWO, BigSpace, SkinGlass, Ripado e Persianas Integradas."
  capa_lede: "Especificação de tipologia, limites dimensionais, perfis de alumínio, montagem e usinagem para os sistemas produzidos pela Solução, sob licença Blindex®. Documento vivo, alimentado à medida que novos desenhos técnicos são liberados."
  produtos:
    sacada:
      nome: "Solução Sacadas"
      page_slug: sacada
    portas-minimalistas:
      nome: "MWO"
      subtitulo: "Minimalist Wide Opening System"
      page_slug: mwo
    portas-robustas:
      nome: "BigSpace"
      page_slug: bigspace
    pele-vidro:
      nome: "SkinGlass"
      page_slug: skinglass
    ripado:
      nome: "Ripado"
      page_slug: ripado
    persianas:
      nome: "Persianas Integradas"
      page_slug: persianas

blindex:
  slug: blindex
  publicada: true
  logo: "assets/img/marcas/blindex.png"        # ladrilho vermelho opaco com texto branco
  logo_claro: "assets/img/marcas/blindex.png"  # o mesmo arquivo serve para a impressao
  logo_pilula: true                            # fundo opaco: aparece dentro de uma pilula clara (cores intactas)
  logo_alt: "Blindex"
  label: "Blindex"
  brand_mark: "BLINDEX"
  brand_sub: "Licenciado Solução Fechamento Inteligente"
  color: "#C4000C"        # vermelho amostrado de blindex.png (pixel dominante, 196,0,12)
  color_ink: "#FF5A66"
  tint: "#1C0A0D"
  acao: "#C4000C"
  destaque: "#FF5A66"
  entrada_texto: "Sistemas Blindex®: Blindex Sacadas, Unique, Vista e Skin Vista."
  capa_lede: "Especificação de tipologia, limites dimensionais, perfis de alumínio, montagem e usinagem para os sistemas Blindex®, produzidos pela Solução Fechamento Inteligente sob licença. Documento vivo, alimentado à medida que novos desenhos técnicos são liberados."
  produtos:
    sacada:
      nome: "Blindex Sacadas"
      page_slug: sacadas
      nota: "Também referido como Solução Sacadas nos materiais comerciais anteriores."
    portas-minimalistas:
      nome: "Unique"
      page_slug: unique
      nota: "Nome técnico de origem: MWO — Minimalist Wide Opening System."
    portas-robustas:
      nome: "Vista"
      page_slug: vista
      ocultar_badges: ["Exclusividade Solução"]
      nota: "Nome técnico de origem: BigSpace — grandes vãos."
    pele-vidro:
      nome: "Skin Vista"
      page_slug: skin-vista
      ocultar_badges: ["Exclusividade Solução"]
      nota: "Nome técnico de origem: SkinGlass — pele de vidro."
    # ripado e persianas ausentes de propósito — não existem sob a marca Blindex
